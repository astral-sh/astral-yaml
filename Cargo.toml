[workspace]
members = [
    "crates/astral-yaml",
    "crates/astral-yaml-dev",
    "crates/astral-yaml-serde",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Keep these requirements aligned with workspace.package.version.
astral-yaml = { version = "0.1.0", path = "crates/astral-yaml" }
astral-yaml-serde = { version = "0.1.0", path = "crates/astral-yaml-serde" }

# Omit a version so Cargo excludes this development helper when publishing.
astral-yaml-dev = { path = "crates/astral-yaml-dev" }

annotate-snippets = "0.12.16"
clap = { version = "4.6.7", features = ["derive"] }
deser = { version = "=0.10.1", features = ["derive"] }
deser-value = "=0.10.1"
deser-yaml = "=0.10.1"
divan = { package = "codspeed-divan-compat", version = "5.0.2" }
indoc = "2.0.7"
insta = "1.48.0"
memchr = "2.8.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3.2.0"
test-case = "3.4.0"
serde-saphyr = "=2.0.0"
yaml_serde = "=0.10.7"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
