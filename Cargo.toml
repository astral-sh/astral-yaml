[workspace]
members = [
    "crates/astral-yaml",
    "crates/astral-yaml-dev",
    "crates/astral-yaml-serde",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
astral-yaml = { path = "crates/astral-yaml" }
astral-yaml-dev = { path = "crates/astral-yaml-dev" }
astral-yaml-serde = { path = "crates/astral-yaml-serde" }
serde = { version = "1.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
