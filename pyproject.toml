[project]
name = "astral-yaml"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "astral-dev-toolchain-cargo-codspeed>=5.0.1",
    "astral-dev-toolchain-cargo-fuzz>=0.13.2",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff.lint]
extend-select = ["ANN", "I", "UP"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
