[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "astral-yaml"
description = "Read and write YAML 1.2 in Python"
readme = "crates/astral-yaml-python/README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
compare = ["pyyaml>=6.0.3"]
dev = [
    { include-group = "test" },
    "astral-dev-toolchain-cargo-codspeed>=5.0.1",
    "astral-dev-toolchain-cargo-fuzz>=0.13.2",
    "pytest-codspeed>=5.0.4",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
pgo = []
test = [
    "coverage>=7.17.0",
    "pytest>=9.2.0",
]

[tool.coverage.run]
source = ["astral_yaml"]

[tool.coverage.report]
fail_under = 100

[tool.pytest]
testpaths = ["crates/astral-yaml-python/tests"]

[tool.maturin]
manifest-path = "crates/astral-yaml-python/Cargo.toml"
module-name = "astral_yaml"
pgo-command = "python benchmarks/train_python.py"
pgo-dependency-group = "pgo"
include = [
    { path = "astral_yaml.pyi", format = "sdist" },
    { path = "benchmarks/train_python.py", format = "sdist" },
    { path = "fixtures/real-world/openapi-petstore.yaml", format = "sdist" },
    { path = "fixtures/real-world/LICENSE-openapi", format = "sdist" },
    { path = "fixtures/real-world/ruff-ci.yaml", format = "sdist" },
    { path = "fixtures/real-world/LICENSE-ruff", format = "sdist" },
]

[tool.ruff.per-file-target-version]
"scripts/**" = "py314"

[tool.ruff.lint]
extend-select = ["ANN", "I", "UP"]

[tool.uv]
require-build-hashes = true
preview-features = ["build-dependency-hashes"]
build-constraint-dependencies = [
    { requirement = "maturin==1.16.0", hashes = [
        "sha256:131fcc17ddb3ccc48aa183d2172ebf994c322b858e1b9694fb8744d783df66f6",
        "sha256:2216d731c9324869d3bff72c0c73009bb6e640b3fa7d340174ae70dc874d1d9f",
        "sha256:399fadcd4af39532a173e010240c34930eacc1bb1746bb179863481c68bcf1ab",
        "sha256:5b0573a146803f24566f5b301a4572a8e49bcab4917175407c730da13b46e134",
        "sha256:609228d639c5b888dc41364cbd318547a59f027481f53cba85838f46da4b3f02",
        "sha256:7001fd3ac591820d01f2fa041552c367ec587c98649d9f10a817cc7f28e59062",
        "sha256:837db2f4d93d4899c3ac393fb3cc9eebf35b6002336e5d574f4a4fb6c49fe283",
        "sha256:95f34ce53249fb7095ff4f2aff64d2562c511d6edf3e216c15dbffcd82b72b4f",
        "sha256:9d43a2adf51a2794e907a8f7dbad06eb114d5edb0909c73c1fa9040f15e584e9",
        "sha256:9e221c047931caa79283cc0c2278904ae1b25880dde3574b0447657d72907689",
        "sha256:c16d3589cbddda9420237fdb1394b1a9b36483c0bce83b23de6118c908a8e940",
        "sha256:deacbb204a20326862e194c7df4958e0514a0411c9a3ccf228a00067c11b5c7e",
        "sha256:e285ec9eb10243d45d10417178cb2eb76e0cbb184d0aa4378b503489fa12ee78",
    ] },
]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "astral_yaml.pyi" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/astral-yaml/Cargo.toml" },
    { file = "crates/astral-yaml/src/**/*.rs" },
    { file = "crates/astral-yaml-python/Cargo.toml" },
    { file = "crates/astral-yaml-python/README.md" },
    { file = "crates/astral-yaml-python/src/**/*.rs" },
]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.14" }

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
