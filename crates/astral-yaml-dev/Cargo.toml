[package]
name = "astral-yaml-dev"
description = "Shared test, fuzz, and benchmark helpers for astral-yaml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
compare = ["dep:deser", "dep:deser-value", "dep:deser-yaml", "dep:serde-saphyr", "dep:yaml_serde"]

[dependencies]
annotate-snippets.workspace = true
astral-yaml.workspace = true
astral-yaml-serde.workspace = true
deser = { workspace = true, optional = true }
deser-value = { workspace = true, optional = true }
deser-yaml = { workspace = true, optional = true }
indoc.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { workspace = true, optional = true }
similar.workspace = true
yaml_serde = { workspace = true, optional = true }

[dev-dependencies]
divan.workspace = true
insta.workspace = true

[[bench]]
name = "yaml"
harness = false

[[bench]]
name = "compare"
harness = false
required-features = ["compare"]

[lints]
workspace = true
