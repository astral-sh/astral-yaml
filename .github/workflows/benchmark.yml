name: Benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compare:
        description: Compare implementations
        type: boolean
        default: false

permissions: {}

env:
  COMPARE_IMPLEMENTATIONS: >-
    ${{ (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmarks:compare')) ||
        (github.event_name == 'workflow_dispatch' && inputs.compare) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: CodSpeed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Authenticate uploads to CodSpeed with OIDC.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build benchmarks
        run: |
          if [ "$COMPARE_IMPLEMENTATIONS" = "true" ]; then
            uv run --only-dev --locked cargo codspeed build -p astral-yaml-dev --features compare,editable --bench yaml --bench compare --locked -m simulation
          else
            uv run --only-dev --locked cargo codspeed build -p astral-yaml-dev --features editable --bench yaml --locked -m simulation
          fi

      - name: Run benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: |
            if [ "$COMPARE_IMPLEMENTATIONS" = "true" ]; then
              uv run --only-dev --locked cargo codspeed run -p astral-yaml-dev --bench yaml --bench compare -m simulation
            else
              uv run --only-dev --locked cargo codspeed run -p astral-yaml-dev --bench yaml -m simulation
            fi

  python:
    name: CodSpeed (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Authenticate uploads to CodSpeed with OIDC.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build the Python extension
        env:
          BENCHMARK_GROUP: ${{ env.COMPARE_IMPLEMENTATIONS == 'true' && 'compare' || 'dev' }}
        run: uv sync --locked --python 3.14 --no-editable --group "$BENCHMARK_GROUP"

      - name: Run Python benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: simulation
          run: .venv/bin/pytest benchmarks --codspeed
