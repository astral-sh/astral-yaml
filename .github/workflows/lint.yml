name: Lint

on:
  workflow_call:

permissions: {}

jobs:
  lint:
    name: Linters and formatters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check Rust formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --check

      - name: Run Clippy
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings

      - name: Check Python formatting
        run: uv run --only-dev --locked ruff format --check scripts astral_yaml.pyi crates/astral-yaml-python/tests

      - name: Lint Python
        run: uv run --only-dev --locked ruff check scripts astral_yaml.pyi crates/astral-yaml-python/tests

      - name: Check Python types
        run: |
          uv sync --locked --script scripts/release.py
          uv run --only-dev --locked ty check --python "$(uv python find --script scripts/release.py)" scripts
          uv run --only-dev --locked ty check --python-version 3.11 astral_yaml.pyi crates/astral-yaml-python/tests
