name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo version to release, without a leading v
        required: true
        type: string

permissions: {}

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.repository == 'astral-sh/astral-yaml' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Push the release branch.
      pull-requests: write # Open the version-bump pull request.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Bump workspace version and refresh lockfiles
        run: uv run --locked scripts/release.py -- "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Create or update pull request
        uses: astral-sh/github-actions/create-release-pr@8c3cdbd26db5b9ed8c75193802db22040888af8c # 2026.11.19.1
        with:
          version: ${{ inputs.version }}
          tag-prefix: v
