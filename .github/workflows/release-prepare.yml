name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Cargo version to release, without a leading v
        required: true
        type: string

permissions: {}

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    if: github.repository == 'astral-sh/astral-yaml' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Push the release branch.
      pull-requests: write # Open the version-bump pull request.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cargo-set-version
        run: cargo install --locked --version 0.13.14 --bin cargo-set-version --debug cargo-edit

      - name: Bump workspace version and refresh lockfiles
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Use only the build metadata in VERSION, including when it is empty.
          cargo set-version --workspace --metadata '' -- "$VERSION"
          cargo update --workspace --manifest-path fuzz/Cargo.toml

      - name: Create or update pull request
        uses: astral-sh/github-actions/create-release-pr@b18ab2e0c11d16711c1818c8774babfa0203b909 # 2026.10.08.0
        with:
          version: ${{ inputs.version }}
          tag-prefix: v
