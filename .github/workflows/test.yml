name: Test

on:
  workflow_call:

permissions: {}

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview

      - name: Verify fixtures
        run: uv run --script scripts/verify-fixtures.py

      - name: Run unit, integration, and doc tests
        run: cargo test --workspace --all-features --locked

      - name: Test without optional features
        run: cargo test --workspace --no-default-features --locked

      - name: Enforce coverage
        run: cargo xtask cov
