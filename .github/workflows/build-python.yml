name: Build Python distributions

on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/build-python.yml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: python-distributions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    env:
      RUSTUP_TOOLCHAIN: stable
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install Rust with LLVM profiling tools
        if: runner.os != 'Linux'
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview

      # MSVC's linker produces an unreadable LLVM profile on Windows ARM64.
      # https://github.com/rust-lang/rust/issues/156675
      - name: Use LLVM's linker for the Windows ARM64 target
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: |
          echo "CARGO_BUILD_TARGET=aarch64-pc-windows-msvc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER=rust-lld" >> "$GITHUB_ENV"

      - name: Build manylinux PGO wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          maturin-version: v1.16.0
          manylinux: "2_17"
          rustup-components: llvm-tools-preview
          docker-options: --env UV_LOCKED=1 --env UV_NO_DEFAULT_GROUPS=true
          args: --release --locked --pgo --interpreter /opt/python/cp313-cp313/bin/python --out dist

      - name: Build PGO wheel
        if: runner.os != 'Linux'
        run: uv build --wheel -C "maturin.build-args=--locked --compatibility pypi"
        env:
          MATURIN_PGO: "1"
          UV_LOCKED: "1"
          UV_NO_DEFAULT_GROUPS: "true"

      - name: Test the release wheel
        shell: bash
        run: |
          uv sync --locked --only-group test
          uv pip install --no-deps dist/*.whl
          uv run --no-sync python -m pytest

      - name: Build source distribution
        if: matrix.os == 'ubuntu-24.04'
        run: uv build --sdist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          overwrite: true
