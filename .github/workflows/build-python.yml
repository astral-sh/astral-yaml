name: Build Python distributions

on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/build-python.yml
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: python-distributions-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Python wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025, windows-11-arm]
    env:
      RUSTUP_TOOLCHAIN: stable
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install Rust with LLVM profiling tools
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview

      - name: Build source distribution
        if: matrix.os == 'ubuntu-24.04'
        run: uv build --sdist

      - name: Build PGO wheel
        run: uv build --wheel -C "maturin.build-args=--locked --compatibility pypi"
        env:
          MATURIN_PGO: "1"
          UV_LOCKED: "1"
          UV_NO_DEFAULT_GROUPS: "true"
          # MSVC's linker corrupts PGO profiles on Windows ARM64 (rust-lang/rust#156675).
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: rust-lld

      - name: Test the release wheel
        shell: bash
        run: |
          uv sync --locked --only-group test
          uv pip install --no-deps dist/*.whl
          uv run --no-sync python -m pytest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          overwrite: true
