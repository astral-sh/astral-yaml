name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    uses: $/.github/workflows/test.yml

  lint:
    permissions:
      contents: read
    uses: $/.github/workflows/lint.yml

  zizmor:
    permissions:
      contents: read
    uses: $/.github/workflows/zizmor.yml
