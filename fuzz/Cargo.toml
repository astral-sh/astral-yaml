[package]
name = "astral-yaml-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
astral-yaml = { path = "../crates/astral-yaml" }
astral-yaml-serde = { path = "../crates/astral-yaml-serde" }
yaml_serde = "=0.10.7"
astral-yaml-dev = { path = "../crates/astral-yaml-dev" }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde"
path = "fuzz_targets/serde.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
