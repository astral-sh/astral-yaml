[package]
name = "astral-yaml-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Keep the import and clone lints in sync with the root workspace.
[lints.rust]
redundant_imports = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[lints.clippy]
enum_glob_use = "warn"
macro_use_imports = "warn"
redundant_clone = "warn"
unnecessary_self_imports = "warn"
wildcard_imports = "warn"

[dependencies]
libfuzzer-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }
astral-yaml = { path = "../crates/astral-yaml" }
astral-yaml-dev = { path = "../crates/astral-yaml-dev", features = ["editable"] }
astral-yaml-serde = { path = "../crates/astral-yaml-serde", features = ["editable"] }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serde"
path = "fuzz_targets/serde.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "typed"
path = "fuzz_targets/typed.rs"
test = false
doc = false
bench = false

[[bin]]
name = "editable"
path = "fuzz_targets/editable.rs"
test = false
doc = false
bench = false

[[bin]]
name = "editable-model"
path = "fuzz_targets/editable_model.rs"
test = false
doc = false

[[bin]]
name = "editable-graph"
path = "fuzz_targets/editable_graph.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
